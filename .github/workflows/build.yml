name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mac_smoke_runs:
        description: Times to run the smoke test on each Mac, to chase a failure that only happens now and then
        default: "1"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # Avalonia's build step sends anonymous usage data to its vendor unless this is set.
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          # Each Mac build is made and tested on the kind of Mac it is for: an Apple silicon
          # runner and an Intel one. The Intel build does run on Apple silicon, through
          # Rosetta, but that tests Apple's translator as much as it tests the build.
          - os: macos-latest
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        if: runner.os != 'macOS'
        shell: bash
        run: >
          dotnet publish src/DeskDancer -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o dist/${{ matrix.rid }}

      # On a Mac the publish script also wraps the program up as DeskDancer.app and signs it.
      - name: Publish (macOS)
        if: runner.os == 'macOS'
        run: ./publish.sh ${{ matrix.rid }}

      # The smoke test starts the real app, drives every feature for a few seconds and
      # exits non-zero if a step fails, a window stops drawing or anything throws.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb openbox
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            openbox & sleep 1
            dist/linux-x64/DeskDancer --smoke-test --seconds 15 --out smoke'

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          # A picture of the desktop is nice to have; failing to take one must not fail the build.
          function Save-Desktop($path) {
            try {
              $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
              $bmp.Save($path)
              $g.Dispose(); $bmp.Dispose()
            } catch {
              Write-Warning "Could not capture the desktop: $_"
            }
          }
          New-Item -ItemType Directory -Force smoke | Out-Null
          $out = (Resolve-Path smoke).Path
          $app = Start-Process -FilePath dist\win-x64\DeskDancer.exe -PassThru `
            -ArgumentList '--smoke-test', '--seconds', '20', '--out', "`"$out`""
          $null = $app.Handle   # keeps the exit code readable after the process ends
          # Pictures of the real desktop: standing still, then mid-party with two mates.
          Start-Sleep -Milliseconds 3000; Save-Desktop "$out\desktop-1-standing.png"
          Start-Sleep -Milliseconds 5500; Save-Desktop "$out\desktop-2-party.png"
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw "The smoke test did not finish" }
          if (Test-Path "$out\smoke-result.txt") { Get-Content "$out\smoke-result.txt" }
          else { Write-Warning "No smoke-result.txt was written; the app exited before the test started" }
          Write-Host "Exit code: $($app.ExitCode)"
          exit $app.ExitCode

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          RUNS: ${{ inputs.mac_smoke_runs || '1' }}
        run: |
          app="dist/${{ matrix.rid }}/DeskDancer.app"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "This Mac: macOS $(sw_vers -productVersion), $(uname -m)"
          mkdir -p smoke
          # --screenshots: the test takes screenshots of the real desktop and reads them, to
          # check that the mate is visible and the rest of its window see-through. They are
          # kept with its other results. The runner allows screenshots; a Mac of your own
          # asks first.
          # A workflow started by hand can ask for the test to be run several times over. It
          # stops at the first run that fails.
          case "$RUNS" in ''|*[!0-9]*) RUNS=1 ;; esac
          for run in $(seq 1 "$RUNS"); do
            [ "$RUNS" = 1 ] || echo "--- Run $run of $RUNS"
            "$app/Contents/MacOS/DeskDancer" --smoke-test --screenshots --seconds 20 --out "$PWD/smoke" &
            pid=$!
            # If the app hangs, stop it so the job fails here and not on a timeout hours later.
            ( sleep 180; kill -9 "$pid" ) >/dev/null 2>&1 &
            watchdog=$!
            disown 2>/dev/null || true    # or bash reports stopping it, below, as "Terminated"
            code=0
            wait "$pid" || code=$?
            kill "$watchdog" 2>/dev/null || true
            [ "$code" = 0 ] || break
          done
          [ -f smoke/smoke-result.txt ] || echo "::warning::No smoke-result.txt was written; the app exited before the test started"
          echo "Exit code: $code"
          # Above 128 a signal stopped the app: it crashed. macOS writes a report a few seconds
          # later. Keep it with the results, and show here what each thread was doing.
          if [ "$code" -gt 128 ]; then
            sleep 15
            report="$(ls -t "$HOME"/Library/Logs/DiagnosticReports/DeskDancer*.ips 2>/dev/null | head -1)" || true
            if [ -n "$report" ]; then
              cp "$report" smoke/crash-report.ips
              python3 - "$report" <<'PY' || echo "::warning::Could not read the crash report; it is kept with the smoke test's results"
          import json, sys
          body = open(sys.argv[1], encoding="utf-8", errors="replace").read().partition("\n")[2]
          report = json.loads(body)
          crash = report.get("exception", {})
          images = report.get("usedImages", [])
          def where(frame):
              i = frame.get("imageIndex", -1)
              name = images[i].get("name", "?") if 0 <= i < len(images) else "?"
              return f"{name}  {frame.get('symbol', '?')} +{frame.get('symbolLocation', frame.get('imageOffset', 0))}"
          print("::group::Crash report")
          print("Crashed with", crash.get("type"), crash.get("signal"), crash.get("subtype") or "",
                "| under Rosetta:", report.get("translated"), "| macOS", report.get("osVersion", {}).get("train"))
          for thread in report.get("threads", []):
              crashed = thread.get("triggered")
              print(("CRASHED " if crashed else "") + f"thread {thread.get('id')} {thread.get('name') or thread.get('queue') or ''}")
              for frame in thread.get("frames", [])[: 60 if crashed else 6]:
                  print("   ", where(frame))
          print("::endgroup::")
          PY
            else
              echo "::warning::The app crashed and macOS left no crash report"
            fi
          fi
          exit "$code"

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-${{ matrix.rid }}
          path: smoke
          if-no-files-found: warn

      # An app is a folder whose signature and file permissions matter, and an artifact
      # upload keeps neither. ditto makes a zip that does.
      - name: Zip the app (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/${{ matrix.rid }}/DeskDancer.app" "dist/DeskDancer-${{ matrix.rid }}.zip"

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: DeskDancer-${{ matrix.rid }}
          path: ${{ runner.os == 'macOS' && format('dist/DeskDancer-{0}.zip', matrix.rid) || format('dist/{0}', matrix.rid) }}
